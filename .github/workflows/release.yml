name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        shell: bash
        run: python -m pip install --upgrade pip pyinstaller

      # 构建产物为中文名；上传附件时复制成 ASCII 文件名，
      # 避免 PowerShell / gh 对非 ASCII 路径解析异常导致文件名被截断。
      - name: Build exe
        shell: bash
        run: |
          pyinstaller "Apex语音切换器.spec" --noconfirm
          cp "dist/Apex语音切换器.exe" "dist/ApexVoiceSwitcher-${GITHUB_REF_NAME}.exe"
          ls -lh dist/

      - name: Create Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/ApexVoiceSwitcher-${GITHUB_REF_NAME}.exe" \
            --generate-notes \
            --title "Apex 语音切换器 $GITHUB_REF_NAME"
